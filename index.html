<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sachrechnen Klasse 10</title>
<style>
:root{
  --bg:#f5f6fa; --surface:#ffffff; --surface2:#f0f2f8; --text:#1c2233; --muted:#5d6579; --border:#dfe3ec;
  --accent:#3b5bdb; --accent-soft:#e8edff; --accent-text:#ffffff;
  --ok:#2b8a3e; --ok-soft:#e7f6eb; --bad:#c92a2a; --bad-soft:#fdeded; --warn:#a85400; --warn-soft:#fff3e0;
  --u1:#3b5bdb; --u2:#0b7f8f; --u3:#6f47d9; --u4:#d9480f; --u5:#b02a6b;
  --u1s:#e8edff; --u2s:#e1f4f6; --u3s:#efe9ff; --u4s:#fff0e6; --u5s:#fbe7f1;
  --shadow:0 1px 2px rgba(20,30,60,.06),0 4px 14px rgba(20,30,60,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12151d; --surface:#1b1f2a; --surface2:#232837; --text:#e7eaf2; --muted:#a2a9bb; --border:#2f3546;
    --accent:#7d97ff; --accent-soft:#252f52; --accent-text:#0f1424;
    --ok:#5fcf7a; --ok-soft:#1b3324; --bad:#ff7b7b; --bad-soft:#3a1f22; --warn:#ffb04d; --warn-soft:#3a2a14;
    --u1:#7d97ff; --u2:#4fc7d6; --u3:#a98bff; --u4:#ff8f5a; --u5:#f07ab4;
    --u1s:#232c4d; --u2s:#163339; --u3s:#2a2448; --u4s:#3a2418; --u5s:#3a1a2c;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#12151d; --surface:#1b1f2a; --surface2:#232837; --text:#e7eaf2; --muted:#a2a9bb; --border:#2f3546;
  --accent:#7d97ff; --accent-soft:#252f52; --accent-text:#0f1424;
  --ok:#5fcf7a; --ok-soft:#1b3324; --bad:#ff7b7b; --bad-soft:#3a1f22; --warn:#ffb04d; --warn-soft:#3a2a14;
  --u1:#7d97ff; --u2:#4fc7d6; --u3:#a98bff; --u4:#ff8f5a; --u5:#f07ab4;
  --u1s:#232c4d; --u2s:#163339; --u3s:#2a2448; --u4s:#3a2418; --u5s:#3a1a2c;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.55 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px 60px}
h1,h2,h3{line-height:1.25;margin:0 0 .5em}
h1{font-size:1.9rem}
h2{font-size:1.45rem}
h3{font-size:1.12rem;margin-top:1.4em}
p{margin:.5em 0}
sup{font-size:.72em;line-height:0}
button{font:inherit;cursor:pointer}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.back{background:none;border:none;color:var(--accent);font-weight:600;padding:6px 0}
.theme-btn{background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:999px;padding:6px 12px;font-size:.88rem}
.hero{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:26px 24px;box-shadow:var(--shadow);margin-bottom:22px;position:relative;overflow:hidden}
.hero .big{position:absolute;right:18px;top:6px;font-size:5.5rem;font-weight:800;color:var(--accent-soft);user-select:none;pointer-events:none}
.hero h1,.hero p{position:relative}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:600px){.grid{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.unit-card{text-align:left;color:var(--text);display:flex;flex-direction:column;gap:8px;border-top:5px solid var(--uc);transition:transform .12s}
.unit-card:hover{transform:translateY(-2px)}
.unit-card .num{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:10px;background:var(--ucs);color:var(--uc);font-weight:800}
.unit-card .title{font-weight:700;font-size:1.06rem}
.status{font-size:.85rem;color:var(--muted)}
.status b{color:var(--ok)}
.final-card{border-top:5px solid var(--warn);grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.8rem;font-weight:700;background:var(--surface2);color:var(--muted)}
.unit-head{border-left:6px solid var(--uc);padding-left:14px;margin-bottom:16px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px}
.tab{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:999px;padding:7px 14px;font-weight:600;font-size:.93rem}
.tab.on{background:var(--uc);border-color:var(--uc);color:var(--accent-text)}
.tab .n{opacity:.7;margin-right:4px}
.formula{background:var(--surface2);border-radius:12px;padding:12px 16px;margin:10px 0;font-size:1.2rem;text-align:center;font-weight:600;overflow-x:auto}
.box-merke,.box-warn,.box-tip{border-radius:12px;padding:12px 16px;margin:14px 0;border-left:5px solid}
.box-merke{background:var(--ucs,var(--accent-soft));border-color:var(--uc,var(--accent))}
.box-warn{background:var(--bad-soft);border-color:var(--bad)}
.box-tip{background:var(--warn-soft);border-color:var(--warn)}
.box-merke b.h,.box-warn b.h,.box-tip b.h{display:block;margin-bottom:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.two{grid-template-columns:1fr}}
.ex{background:var(--surface2);border-radius:12px;padding:12px 14px}
.ex .step{display:block;margin:2px 0}
table.t{border-collapse:collapse;width:100%;margin:10px 0;font-size:.95rem}
table.t th,table.t td{border:1px solid var(--border);padding:8px 10px;text-align:center}
table.t th{background:var(--surface2)}
.tscroll{overflow-x:auto}
.btn{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:10px;padding:9px 16px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.btn.unit{background:var(--uc);border-color:var(--uc);color:var(--accent-text)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:default}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.navrow{display:flex;justify-content:space-between;gap:8px;margin-top:22px;flex-wrap:wrap}
/* questions */
.q-text{font-size:1.15rem;margin:6px 0 10px}
.q-text .box,.sci-row .box{width:3.4em}
input.box,input.ans{font:inherit;color:var(--text);background:var(--surface);border:2px solid var(--border);border-radius:8px;padding:4px 8px;text-align:center}
input.box{font-size:.95rem;padding:2px 4px;vertical-align:middle;line-height:1.2}
sup input.box{font-size:.9rem;vertical-align:baseline}
input.ans{width:min(280px,100%);padding:8px 10px}
input.ans.m{width:6em}
input:focus{outline:none;border-color:var(--accent)}
input.ans.locked,input.box.locked{opacity:.8}
.ans-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:1.15rem}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.opt{border:2px solid var(--border);background:var(--surface);color:var(--text);border-radius:10px;padding:10px 12px;font-size:1.08rem;text-align:left}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.fb{margin-top:14px;border-radius:12px;padding:12px 16px;border-left:5px solid}
.fb.ok{background:var(--ok-soft);border-color:var(--ok)}
.fb.bad{background:var(--bad-soft);border-color:var(--bad)}
.fb-title{font-weight:800;margin-bottom:4px}
.fb.ok .fb-title{color:var(--ok)} .fb.bad .fb-title{color:var(--bad)}
.expl{margin-top:6px}
.hint{margin-top:10px;background:var(--warn-soft);border-radius:10px;padding:8px 12px;font-size:.95rem}
.warnmsg{color:var(--bad);font-size:.9rem;margin-top:6px}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.progress{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;margin:6px 0 16px}
.progress > div{height:100%;background:var(--uc,var(--accent));border-radius:99px;transition:width .3s}
.score-big{font-size:3rem;font-weight:800;line-height:1}
.stars{font-size:2rem;letter-spacing:4px;color:var(--warn)}
.stars .off{color:var(--border)}
/* explore */
.ctrl-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:8px 0}
.ctrl-row label{min-width:150px}
input[type=range]{flex:1;min-width:160px;accent-color:var(--uc,var(--accent))}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.seg button{border:none;background:var(--surface);color:var(--text);padding:7px 12px;font-weight:600}
.seg button.on{background:var(--uc);color:var(--accent-text)}
.stage{background:var(--surface2);border-radius:14px;padding:16px;margin:12px 0;overflow-x:auto}
.bignum{font-size:1.7rem;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;word-break:break-all}
.bignum .comma{color:var(--uc);font-size:1.15em}
.result{text-align:center;font-size:1.15rem;margin-top:8px}
.alltag{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin:12px auto 0;max-width:560px}
.alltag .ex-icon{font-size:1.8rem;line-height:1}
.box-alltag{background:var(--ok-soft);border-left:5px solid var(--ok);border-radius:12px;padding:12px 16px;margin:14px 0}
.box-alltag b.h{display:block;margin-bottom:4px}
.badge-ok{display:inline-block;background:var(--ok-soft);color:var(--ok);padding:3px 10px;border-radius:99px;font-weight:700;font-size:.9rem}
.badge-no{display:inline-block;background:var(--surface);color:var(--muted);padding:3px 10px;border-radius:99px;font-weight:700;font-size:.9rem;border:1px solid var(--border)}
.tiles{display:flex;flex-wrap:wrap;gap:5px;align-items:center;justify-content:center}
.tile{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:34px;padding:0 6px;border-radius:8px;font-weight:700;color:#fff}
.tile.a1{background:var(--u1)} .tile.a2{background:var(--u4)} .tile.a3{background:var(--u3)}
.tile.x{opacity:.35;text-decoration:line-through;text-decoration-thickness:3px}
.frac{display:inline-flex;flex-direction:column;align-items:center;gap:6px}
.frac .bar{height:3px;background:var(--text);width:100%;border-radius:2px}
.op{font-size:1.4rem;font-weight:700;margin:0 4px}
.rows{display:inline-flex;flex-direction:column;gap:5px}
.rows .r{display:flex;gap:5px;align-items:center}
.rows .lbl{width:68px;font-size:.85rem;color:var(--muted);text-align:right;margin-right:4px}
canvas{width:100%;display:block;border-radius:12px;background:var(--surface)}
select{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 8px}
.cert{border:3px solid var(--warn);border-radius:18px;padding:22px;text-align:center;background:var(--surface)}
.cert .name{font-size:1.6rem;font-weight:800}
.bars{display:grid;gap:8px;margin:14px 0;text-align:left}
.barrow{display:grid;grid-template-columns:150px 1fr 70px;gap:10px;align-items:center;font-size:.92rem}
@media (max-width:520px){.barrow{grid-template-columns:100px 1fr 60px}}
.barrow .track{height:12px;background:var(--surface2);border-radius:99px;overflow:hidden}
.barrow .fill{height:100%;border-radius:99px}
.review{margin-top:14px;text-align:left}
.review details{border:1px solid var(--border);border-radius:10px;padding:8px 12px;margin:6px 0;background:var(--surface)}
.review summary{cursor:pointer;font-weight:600}
details.rules{margin-top:22px}
details.rules > summary{cursor:pointer;font-weight:700;font-size:1.05rem;padding:4px 0}
.rulegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:10px}
.rulegrid .ex{font-size:.98rem}
.namefield{font:inherit;color:var(--text);background:var(--surface);border:2px solid var(--border);border-radius:10px;padding:9px 12px;width:min(320px,100%)}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
footer{margin-top:40px;font-size:.82rem;color:var(--muted);text-align:center}
/* ---------- Erweiterung: Fortschritt, Diagnose, Spiele ---------- */
html,body{touch-action:manipulation}
.tab.on{background:var(--uc,var(--accent));border-color:var(--uc,var(--accent))}
.seg button.on{background:var(--uc,var(--accent))}
.btn.unit{background:var(--uc,var(--accent));border-color:var(--uc,var(--accent))}
.btn.small{padding:6px 12px;font-size:.88rem}
.topright{display:flex;gap:8px;align-items:center}
.me-chip{background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:999px;padding:6px 12px;font-size:.88rem;font-weight:600}
.toasts{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:90;width:min(420px,calc(100% - 32px));pointer-events:none}
.toast{background:var(--text);color:var(--bg);border-radius:12px;padding:10px 14px;box-shadow:var(--shadow);font-weight:600;animation:tin .25s ease-out}
@keyframes tin{from{transform:translateY(12px);opacity:0}}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 16px}
.chip{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:999px;padding:7px 12px;font-size:.9rem;text-align:left}
.chip.on{border-color:var(--uc,var(--accent));box-shadow:0 0 0 2px var(--uc,var(--accent)) inset}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--border);vertical-align:middle}
.dot.g{background:var(--ok)} .dot.y{background:#e8b100} .dot.r{background:var(--bad)}
.symbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.symbar button{min-width:44px;height:38px;border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:8px;font-weight:700;font-size:1.05rem}
.hints .hint{margin-top:8px}
.fb.try{background:var(--warn-soft);border-color:var(--warn)}
.fb.try .fb-title{color:var(--warn)}
.diag{margin-top:10px;background:var(--surface);border:1px dashed var(--bad);border-radius:10px;padding:10px 12px}
.diag-h{font-weight:800;margin-bottom:4px}
.diag-ex{margin-top:6px;font-size:.95rem;color:var(--muted)}
.diag .btn{margin-top:8px}
.qnote{background:var(--accent-soft);border-radius:10px;padding:8px 12px;margin:-2px 0 12px;font-size:.95rem}
.qbox{display:inline-block;min-width:1.6em;border:2px dashed var(--accent);border-radius:6px;text-align:center;line-height:1.2}
.feat{display:flex;flex-direction:column;gap:6px;text-align:left;color:var(--text)}
.feat .fi{font-size:1.8rem}
.feat b{font-size:1.05rem}
.lvlcard{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.lvlcard .li{font-size:2.6rem}
.xpbar{height:10px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-top:6px;min-width:200px}
.xpbar > div{height:100%;background:linear-gradient(90deg,var(--u1),var(--u3));border-radius:99px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.stat{background:var(--surface2);border-radius:12px;padding:8px 12px;font-size:.88rem}
.stat b{display:block;font-size:1.2rem}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px}
.bdg{text-align:center;padding:12px 10px;border-radius:14px;background:var(--surface);border:1px solid var(--border)}
.bdg .bi{font-size:2rem}
.bdg b{display:block;margin:4px 0 2px}
.bdg.off{opacity:.5;filter:grayscale(1)}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pc{border-radius:14px;padding:12px;background:var(--surface);border:2px solid var(--u1);min-height:150px;display:flex;flex-direction:column;gap:6px}
.pc.small-n{border-color:var(--u3)}
.pc .pc-top{display:flex;justify-content:space-between;align-items:center}
.pc .pc-pow{font-weight:800;font-size:1.25rem}
.pc .pc-icon{font-size:1.6rem}
.pc .pc-txt{font-size:.82rem;color:var(--muted)}
.pc.locked{border:2px dashed var(--border);align-items:center;justify-content:center;color:var(--muted);text-align:center}
.mis-row{border:1px solid var(--border);border-radius:14px;padding:14px;margin:10px 0;background:var(--surface)}
.mis-row .mh{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.mis-row .track{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;margin:8px 0}
.mis-row .track > div{height:100%;background:var(--bad);border-radius:99px}
.check-row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
@media (max-width:620px){.check-row{grid-template-columns:1fr}}
.ampel{display:inline-flex;gap:4px}
.ampel button{width:34px;height:34px;border-radius:50%;border:2px solid var(--border);background:var(--surface);font-size:1rem;opacity:.55}
.ampel button.on{opacity:1;border-color:var(--text)}
.perf{font-size:.85rem;color:var(--muted);white-space:nowrap}
.note{font-size:.85rem;margin-top:4px}
.report{white-space:pre-wrap;font:13px/1.5 Consolas,monospace;background:var(--surface2);border-radius:12px;padding:12px;user-select:text;overflow-x:auto}
.goals{background:var(--ucs,var(--accent-soft));border-radius:12px;padding:10px 16px;margin-bottom:12px}
.goals ul{margin:4px 0 0;padding-left:20px}
.timer-bar{height:12px;background:var(--surface2);border-radius:99px;overflow:hidden;margin:6px 0 14px}
.timer-bar > div{height:100%;background:var(--warn);border-radius:99px;transition:width .25s linear}
.bighead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-weight:700}
.bighead .big{font-size:1.6rem}
.opt.flash-ok{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.05)}}
.dline{display:block;width:100%;text-align:left;border:2px solid var(--border);background:var(--surface);color:var(--text);border-radius:10px;padding:10px 12px;margin:6px 0;font-size:1.08rem}
.dline.right{border-color:var(--ok);background:var(--ok-soft)}
.dline.found{border-color:var(--bad);background:var(--bad-soft)}
.dline:disabled{cursor:default}
.dline .ln{display:inline-block;width:1.8em;color:var(--muted);font-size:.85rem}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.role{border-radius:12px;padding:10px 12px;background:var(--surface2);border:2px solid transparent}
.role.on{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.setup{display:grid;gap:12px}
.setup label{font-weight:600}
.unitpick{display:flex;flex-wrap:wrap;gap:8px}
.unitpick label{font-weight:500;border:1px solid var(--border);border-radius:999px;padding:6px 12px;background:var(--surface);display:flex;gap:6px;align-items:center}
body.noscroll{overflow:hidden}
.duel{position:fixed;inset:0;z-index:80;background:var(--bg);display:grid;user-select:none;-webkit-user-select:none}
.duel.face{grid-template-rows:1fr auto 1fr}
.duel.side{grid-template-columns:1fr auto 1fr}
.duel .half{display:flex;flex-direction:column;justify-content:center;gap:12px;padding:16px;overflow:auto;min-width:0}
.duel.face .half.p2{transform:rotate(180deg)}
.duel .half.p1{--pc:var(--u1)} .duel .half.p2{--pc:var(--u4)}
.duel .pl-head{display:flex;justify-content:space-between;align-items:center;font-weight:800;color:var(--pc);font-size:1.1rem}
.duel .pl-score{font-size:2rem}
.duel .pl-q{font-size:1.25rem;text-align:center}
.duel .pl-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}

<script>
"use strict";
/* ---------- Hilfsfunktionen ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const rnd = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const neg = x => String(x).replace(/-/g, '−');
function de(x) { return String(Number(Number(x).toPrecision(12))).replace('.', ',').replace('-', '−'); }
const pw = (b, e) => `${b}<sup>${neg(e)}</sup>`;
const sciH = (m, e) => `${de(m)}&thinsp;·&thinsp;10<sup>${neg(e)}</sup>`;
const par = x => x < 0 ? `(${neg(x)})` : neg(x);
const NB = ' ';
function groupInt(s) { return s.replace(/\B(?=(\d{3})+(?!\d))/g, NB); }
function groupFrac(s) { return s.replace(/(\d{3})(?=\d)/g, '$1' + NB); }
/* Zahl D·10^E als Dezimalzahl (D: Ziffernstring) */
function decParts(D, E) {
  if (E >= 0) return [D + '0'.repeat(E), ''];
  const n = -E;
  if (D.length > n) return [D.slice(0, D.length - n), D.slice(D.length - n)];
  return ['0', '0'.repeat(n - D.length) + D];
}
function decStr(D, E) { const [i, f] = decParts(D, E); return groupInt(i) + (f ? ',' + groupFrac(f) : ''); }
function parseDE(s) {
  s = String(s).trim().replace(/[−–—]/g, '-').replace(/[\s  ]/g, '');
  if (!s) return NaN;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  if (!/^[-+]?(\d+\.?\d*|\.\d+)$/.test(s)) return NaN;
  return Number(s);
}
const normStr = s => String(s).toLowerCase().replace(/[−–—]/g, '-').replace(/[\s·*]/g, '');
function parseSet(s) {
  let t = String(s).trim().toLowerCase().replace(/[−–—]/g, '-');
  if (/^(keine.*|kein.*|leer.*|l\s*=\s*(\{\s*\}|∅|ø)|\{\s*\}|∅|ø|-)$/.test(t)) return [];
  t = t.replace(/^l\s*=\s*/, '').replace(/[{}]/g, '').replace(/x\s*[₁₂₃₄0-9]*\s*=/g, ' ');
  let pm = t.match(/^\s*(±|\+\/?-|-\/?\+)\s*(.+)$/);
  if (pm) { const v = parseDE(pm[2]); return isNaN(v) ? null : [v, -v]; }
  const parts = t.split(/\s*;\s*|\s+und\s+|\s+oder\s+|,\s+|\s+/).filter(Boolean);
  const out = [];
  for (const p of parts) {
    const m = p.match(/^(±|\+\/?-)(.+)$/);
    if (m) { const v = parseDE(m[2]); if (isNaN(v)) return null; out.push(v, -v); continue; }
    const v = parseDE(p); if (isNaN(v)) return null; out.push(v);
  }
  return out.length ? out : null;
}
function fmtSet(arr) {
  if (!arr.length) return 'keine Lösung (L = { })';
  if (arr.length === 1) return `x = ${de(arr[0])}`;
  return arr.map((v, i) => `x<sub>${i + 1}</sub> = ${de(v)}`).join('; ');
}


/* ---------- Speicher (nur im Browser der Schülerin/des Schülers) ---------- */
const KEY = 'sachrechnen-kl10-v1';

/* ---------- Zahlen formatieren ---------- */
// fmtN(1234.5, 2) → „1234,50“; ab 5 Stellen mit schmalem Leerzeichen gruppiert
function fmtN(v, dec) {
  if (!isFinite(v)) return '–';
  const s = dec === undefined ? String(Number(Number(v).toPrecision(12))) : Number(v).toFixed(dec);
  let [i, f] = s.replace('-', '').split('.');
  if (i.length > 4) i = groupInt(i);
  const zero = Number(s) === 0;
  return (v < 0 && !zero ? '−' : '') + i + (f ? ',' + f : '');
}
const eur = v => (Number.isInteger(r2(v)) ? fmtN(r2(v)) : fmtN(v, 2)) + '&nbsp;€';
const pct = v => fmtN(v) + '&nbsp;%';
const r2 = x => Math.round(x * 100) / 100;
const r1 = x => Math.round(x * 10) / 10;
const rp = (x, d) => Math.round(x * Math.pow(10, d)) / Math.pow(10, d);
// Toleranz für Geldbeträge: Rundung auf Cent und gerundete Zwischenwerte

/* ---------- Diagramme als SVG ---------- */
const CCOL = ['var(--u1)', 'var(--u4)', 'var(--u2)', 'var(--u3)', 'var(--u5)', 'var(--warn)'];
function chartAxis(o, W, H, L, R, T, Bm) {
  const min = o.min || 0, step = o.step, ph = H - T - Bm, max = o.max;
  const y = v => T + ph - (v - min) / (max - min) * ph;
  let s = '';
  if (o.minor) for (let v = min + step / 2; v < max; v += step) s += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" class="cm"/>`;
  for (let v = min; v <= max + 1e-9; v += step) s += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" class="cg"/><text x="${L - 6}" y="${y(v) + 4}" class="cl" text-anchor="end">${fmtN(rp(v, 6))}</text>`;
  s += `<line x1="${L}" x2="${L}" y1="${T - 4}" y2="${y(min)}" class="ca"/><line x1="${L}" x2="${W - R}" y1="${y(min)}" y2="${y(min)}" class="ca"/>`;
  if (o.ylab) s += `<text transform="rotate(-90)" x="${-(T + ph / 2)}" y="13" class="cl" text-anchor="middle">${o.ylab}</text>`;
  if (o.title) s += `<text x="${W / 2}" y="17" class="ct" text-anchor="middle">${o.title}</text>`;
  return { s, y };
}
// Säulendiagramm. o: { labels, values, step, max?, min?, ylab?, title?, minor?, colors? }
function svgBars(o) {
  const W = 440, H = 250, L = o.ylab ? 62 : 46, R = 12, T = o.title ? 30 : 14, Bm = 34;
  o = Object.assign({}, o); o.max = o.max ?? Math.ceil(Math.max(...o.values) / o.step) * o.step;
  const { s: ax, y } = chartAxis(o, W, H, L, R, T, Bm), n = o.values.length, pw = W - L - R, bw = Math.min(56, pw / n * 0.6);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${o.title || 'Säulendiagramm'}">` + ax;
  o.values.forEach((v, i) => {
    const cx = L + pw * (i + 0.5) / n;
    s += `<rect x="${cx - bw / 2}" y="${y(v)}" width="${bw}" height="${Math.max(0, y(o.min || 0) - y(v))}" rx="2" style="fill:${(o.colors || [])[i] || CCOL[0]}"/>`;
    s += `<text x="${cx}" y="${H - Bm + 17}" class="cl" text-anchor="middle">${o.labels[i]}</text>`;
  });
  return s + '</svg>';
}
// Liniendiagramm. o: { labels, series: [{ vals, name?, col? }], step, min?, max?, ylab?, title?, minor? }
function svgLine(o) {
  const W = 440, H = 250, L = o.ylab ? 62 : 50, R = 14, T = o.title ? 30 : 14, Bm = o.series.length > 1 ? 50 : 34;
  o = Object.assign({}, o); o.max = o.max ?? Math.ceil(Math.max(...o.series.flatMap(s => s.vals)) / o.step) * o.step;
  const { s: ax, y } = chartAxis(o, W, H, L, R, T, Bm), n = o.labels.length, pw = W - L - R;
  const x = i => L + pw * (n === 1 ? 0.5 : (i + 0.25) / (n - 0.5));
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${o.title || 'Liniendiagramm'}">` + ax;
  const every = Math.ceil(n / 12);
  o.labels.forEach((lb, i) => { if (i % every === 0) s += `<text x="${x(i)}" y="${H - Bm + 17}" class="cl" text-anchor="middle">${lb}</text>`; });
  o.series.forEach((se, k) => {
    const col = se.col || CCOL[k];
    s += `<polyline fill="none" style="stroke:${col}" stroke-width="3" stroke-linejoin="round" points="${se.vals.map((v, i) => `${x(i)},${y(v)}`).join(' ')}"/>`;
    if (n <= 16) se.vals.forEach((v, i) => { s += `<circle cx="${x(i)}" cy="${y(v)}" r="4" style="fill:${col}"/>`; });
    if (o.series.length > 1) s += `<rect x="${L + k * 150}" y="${H - 18}" width="14" height="5" rx="2" style="fill:${col}"/><text x="${L + k * 150 + 20}" y="${H - 12}" class="cl">${se.name}</text>`;
  });
  return s + '</svg>';
}
// Kreisdiagramm. o: { labels, values (Prozent, Summe 100), title?, deg? (Winkel statt Prozent anzeigen), hideIdx? }
function svgPie(o) {
  const W = 440, H = 230, cx = 115, cy = o.title ? 125 : 115, r = 95;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${o.title || 'Kreisdiagramm'}">`;
  if (o.title) s += `<text x="${W / 2}" y="17" class="ct" text-anchor="middle">${o.title}</text>`;
  let a0 = -Math.PI / 2;
  o.values.forEach((v, i) => {
    const a1 = a0 + v / 100 * 2 * Math.PI, large = v > 50 ? 1 : 0, col = (o.colors || [])[i] || CCOL[i % CCOL.length];

    else s += `<path d="M${cx},${cy} L${cx + r * Math.cos(a0)},${cy + r * Math.sin(a0)} A${r},${r} 0 ${large} 1 ${cx + r * Math.cos(a1)},${cy + r * Math.sin(a1)} Z" style="fill:${col};stroke:var(--surface);stroke-width:2"/>`;

// Streifendiagramm. o: { labels, values (Prozent) }
function svgStrip(o) {

const THEORY = {
1: `

</div>
<div class="formula">neuer Wert = alter Wert · q</div>

<h3>Anfangskapital berechnen</h3>
<div class="formula">K<sub>0</sub> = K<sub>n</sub> : q<sup>n</sup></div>

<h3>Zinssatz berechnen</h3>
<p>Teile das Endkapital durch das Anfangskapital. Dann ziehst du die n-te Wurzel und erhältst q.</p>
<div class="formula">q<sup>n</sup> = K<sub>n</sub> : K<sub>0</sub> &nbsp;&nbsp; → &nbsp;&nbsp; q = <sup>n</sup>√(K<sub>n</sub> : K<sub>0</sub>)</div>
<div class="ex"><b>Beispiel:</b> Aus 2000 € werden in 2 Jahren 2205 €.

    <div class="actions" style="margin-top:0">

      <button class="btn small" type="button" id="e5o">🚀 Ausreißer 200 €</button>
      <button class="btn small" type="button" id="e5d">➖ Letzten Wert löschen</button>
      <button class="btn small ghost" type="button" id="e5z">↺ Zurücksetzen</button></div>
    <div class="ctrl-row"><label for="e5i">Eigener Wert:</label><input id="e5i" class="ans m" inputmode="decimal" placeholder="z. B. 30"><button class="btn small" type="button" id="e5a">Hinzufügen</button></div>
    <div id="e5c"></div><div class="stage" id="e5s"></div>`;
  const dot = () => {
    const mn = Math.min(...data), mx = Math.max(...data), st = niceStep(Math.max(5, (mx - mn) / 8)), lo = Math.floor(mn / st) * st, hi = Math.max(lo + st, Math.ceil(mx / st) * st);
    const W = 440, H = 150, L = 20, R = 20, base = 105, x = v => L + (v - lo) / (hi - lo) * (W - L - R);
    let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Punktdiagramm"><line x1="${L}" x2="${W - R}" y1="${base}" y2="${base}" class="ca"/>`;
    for (let v = lo; v <= hi + 1e-9; v += st) s += `<line x1="${x(v)}" x2="${x(v)}" y1="${base}" y2="${base + 5}" class="ca"/><text x="${x(v)}" y="${base + 19}" class="cl" text-anchor="middle">${fmtN(v)}</text>`;
    const cnt = {};
    data.forEach(v => { cnt[v] = (cnt[v] || 0) + 1; s += `<circle cx="${x(v)}" cy="${base - 8 - (cnt[v] - 1) * 13}" r="5.5" style="fill:var(--u5)"/>`; });
    const m = mean(data), md = median(data);
    s += `<path d="M${x(m)},${base + 24} l-7,12 h14 z" style="fill:var(--u1)"/><text x="${x(m)}" y="${H - 1}" class="cl" text-anchor="middle" style="fill:var(--u1)">Mittelwert</text>`;
    s += `<path d="M${x(md)},14 l7,8 l-7,8 l-7,-8 z" style="fill:var(--u4)"/><text x="${x(md)}" y="11" class="cl" text-anchor="middle" style="fill:var(--u4)">Median</text>`;
    return s + '</svg>';
  };
  const draw = () => {
    const s = sorted(data), n = s.length, m = mean(data), md = median(data);
    $('#e5c', el).innerHTML = n ? dot() : '';
    if (!n) { $('#e5s', el).innerHTML = '<p>Keine Werte – füge welche hinzu.</p>'; return; }
    const midIdx = n % 2 ? [(n - 1) / 2] : [n / 2 - 1, n / 2];
    $('#e5s', el).innerHTML = `<div><b>Urliste:</b> ${data.join(' &nbsp; ')}</div>
      <div style="margin-top:4px"><b>Rangliste:</b> ${s.map((v, i) => midIdx.includes(i) ? `<span class="mark">${v}</span>` : v).join(' &nbsp; ')} &nbsp;<span class="muted small">(${n} Werte)</span></div>
      <div class="stats"><div class="stat"><b>${fmtN(s[0])} €</b>Minimum</div><div class="stat"><b>${fmtN(s[n - 1])} €</b>Maximum</div><div class="stat"><b>${fmtN(s[n - 1] - s[0])} €</b>Spannweite</div>
        <div class="stat"><b style="color:var(--u1)">${fmtN(r2(m))} €</b>Mittelwert ▲</div><div class="stat"><b style="color:var(--u4)">${fmtN(md)} €</b>Median ◆</div></div>
      <p class="small" style="margin-bottom:0">Mittelwert: ${sum(data)} € : ${n} ≈ ${fmtN(r2(m))} € &nbsp;·&nbsp; Median: ${n % 2 ? `der ${(n + 1) / 2}. Wert` : `(${s[n / 2 - 1]} + ${s[n / 2]}) : 2`} = ${fmtN(md)} €
      ${Math.abs(m - md) > 10 ? '<br>⚠️ Mittelwert und Median liegen weit auseinander – vermutlich gibt es einen <b>Ausreißer</b>. Der Median beschreibt den typischen Wert besser.' : ''}</p>`;
  };
  const add = v => { if (data.length >= 30) return toast('Höchstens 30 Werte.'); data.push(v); draw(); };
  $('#e5r', el).onclick = () => add(rnd(1, 8) * 5);
  $('#e5o', el).onclick = () => add(200);
  $('#e5d', el).onclick = () => { if (data.length > 1) { data.pop(); draw(); } };
  $('#e5z', el).onclick = () => { data = [10, 15, 15, 20, 20, 25]; draw(); };

  draw();
}

// cfg: { kinds | pickKind, title, sub, count, fixId, onEnd }
function trainer(c, cfg) {
  let n = 0, right = 0, firstOk = 0;
  c.innerHTML = `<div class="qhead"><h3 style="margin:0">${cfg.title}</h3><span class="tstat"></span></div>
    ${cfg.sub ? `<p class="muted small" style="margin:4px 0 8px">${cfg.sub}</p>` : ''}
    ${cfg.count ? '<div class="progress"><div style="width:0%"></div></div>' : '<div style="height:10px"></div>'}
    <div class="tq"></div><div class="actions tnav"></div>`;
  const stat = () => {
    $('.tstat', c).innerHTML = cfg.count ? `<span class="pill">Aufgabe ${Math.min(n + 1, cfg.count)} von ${cfg.count}</span>`
      : `<span class="pill">${right} von ${n} richtig</span> <span class="pill" title="Richtige Antworten in Folge">🔥 ${store.streak}</span>`;
  };
  const next = () => {
    if (cfg.count && n >= cfg.count) return cfg.onEnd({ n, right, firstOk });
    stat();
    const k = cfg.pickKind ? cfg.pickKind() : pick(cfg.kinds);
    const q = genKind(k);
    $('.tnav', c).innerHTML = '';
    renderQuestion($('.tq', c), q, (ok, info) => {
      n++; if (ok) right++; if (ok && info.attempt === 1) firstOk++;
      const xp = record(q, ok, info, 'train');
      stat();
      if (cfg.count) $('.progress > div', c).style.width = (n / cfg.count * 100) + '%';
      const last = cfg.count && n >= cfg.count;
      $('.tnav', c).innerHTML = `<button class="btn unit" type="button">${last ? 'Auswertung →' : 'Nächste Aufgabe →'}</button><span class="muted small">+${xp} XP</span>`;
      const b = $('.tnav button', c); b.onclick = next; b.focus({ preventScroll: true });
    }, { hints: true, retry: true, onFix: cfg.fixId ? null : startFix });
  };
  next();
}

const SECS = { A1: 'Pflichtteil A1 – ohne Taschenrechner', A2: 'Pflichtteil A2 – mit Taschenrechner', W: 'Wahlteil' };

function wahlW1() {

      expl: `${eur(K0)} · ${fmtN(q)}<sup>${n}</sup> ≈ <b>${eur(Kn)}</b>` }, MON(Kn)),
    Object.assign({ k: 'zEnd', u: 2, type: 'input', q: `${story}<br><b>b)</b> Wie viel Euro Zinsen hat ${who} insgesamt bekommen?`, a: [Z], mis: [{ v: Kn, id: 'Z_INTEREST' }],
      expl: `${eur(Kn)} − ${eur(K0)} = <b>${eur(Z)}</b>` }, MON(Z)),
    { k: 'zRate', u: 2, type: 'input', q: `${story}<br><b>c)</b> Eine andere Bank verspricht, dass aus ${eur(K0)} in derselben Zeit ${eur(T)} werden. Welchen Zinssatz bietet sie?`, a: [p2], tol: 0.02, suf: '%',

      expl: `${fmtN(T)} : ${fmtN(K0)} = ${fmtN(rp(T / K0, 6))} → q = <sup>${n}</sup>√${fmtN(rp(T / K0, 6))} ≈ ${fmtN(1 + p2 / 100)} → <b>${fmtN(p2)} %</b>` }

function wahlW2() {

  const story = `🏙️ Eine Stadt hat ${fmtN(a)} Einwohner. Man rechnet damit, dass die Einwohnerzahl jedes Jahr um ${fmtN(p)} % wächst.`;

    { k: 'eFactor', u: 3, type: 'input', q: `${story}<br><b>a)</b> Gib den Wachstumsfaktor an.`, a: [q], ph: 'q', mis: [{ v: p / 100, id: 'E_DECAY' }, { v: 1 + p / 10, id: 'E_DECAY' }], expl: `q = 1 + ${fmtN(p / 100)} = <b>${fmtN(q)}</b>` },
    { k: 'eValue', u: 3, type: 'input', q: `${story}<br><b>b)</b> Wie viele Einwohner hat die Stadt nach ${n} Jahren? (Runde auf ganze Einwohner.)`, a: [v], tol: 1.01, suf: 'Einwohner',

/* ---------- Blitzrunde ---------- */
function startBlitz(units) {
  const c = gameShell('Blitzrunde', '⚡');
  c.innerHTML = `<p>Du hast <b>60 Sekunden</b>. Jede richtige Antwort bringt 1 Punkt, ab 3 richtigen in Folge gibt es Bonuspunkte. Falsche Antworten kosten nichts – aber die Serie ist weg.</p>
    <div class="actions"><button class="btn primary" type="button" id="bgo">⚡ Start</button></div>`;
  $('#bgo', c).onclick = () => blitzRun(c, units);
}
function blitzRun(c, units) {
  const T = 60; let left = T, score = 0, streak = 0, busy = false; const log = [];
  c.innerHTML = `<div class="bighead"><span>⏱ <span class="big" id="bt">${T}</span> s</span><span>🔥 Serie <span id="bs">0</span></span><span>⭐ <span class="big" id="bp">0</span> Punkte</span></div>
    <div class="timer-bar"><div id="bbar" style="width:100%"></div></div><div id="bq"></div>`;
  const tick = setInterval(() => {
    if (!document.body.contains(c)) return clearInterval(tick);
    left--; $('#bt', c).textContent = left; $('#bbar', c).style.width = (left / T * 100) + '%';
    if (left <= 0) { clearInterval(tick); end(); }
  }, 1000);
  const next = () => {
    if (left <= 0) return;
    const q = gameQ(units); busy = false;
    $('#bq', c).innerHTML = `<div class="q-text">${q.q}</div><div class="opts">${q.opts.map((o, i) => `<button class="opt" type="button" data-i="${i}">${o}</button>`).join('')}</div>`;
    $$('.opt', c).forEach(b => b.onclick = () => {
      if (busy || left <= 0) return; busy = true;
      const i = +b.dataset.i, ok = i === q.a, mis = ok ? null : diagnose(q, i);
      log.push({ q, ok, mis: mis ? [mis] : [] });
      record(q, ok, { mis: mis ? [mis] : [] }, 'blitz');
      if (ok) { streak++; score += 1 + Math.floor(streak / 3); b.classList.add('right', 'flash-ok'); }
      else { streak = 0; b.classList.add('wrong'); $$('.opt', c)[q.a].classList.add('right'); }
      $('#bp', c).textContent = score; $('#bs', c).textContent = streak;
      setTimeout(next, ok ? 350 : 1100);
    });
  };
  const end = () => {
    const rec = score > store.blitzBest;
    store.blitzBest = Math.max(store.blitzBest, score); addXP(score * 3); checkBadges(); save();
    c.innerHTML = `<div style="text-align:center"><div style="font-size:3rem">${rec ? '🏆' : '⚡'}</div><div class="score-big">${score} Punkte</div>
      <p>${rec ? '<b>Neuer Rekord!</b>' : `Dein Rekord: ${store.blitzBest}`} · ${log.filter(l => l.ok).length} von ${log.length} richtig · +${score * 3} XP</p></div>
      ${focusBlock(log)}
      <div class="actions" style="justify-content:center"><button class="btn primary" type="button" id="bagain">⚡ Nochmal</button><button class="btn" type="button" id="bplay">Zurück zu Spielen</button></div>`;
    bindFocus(c);
    if (rec && score > 0) confetti();
    $('#bagain', c).onclick = () => blitzRun(c, units);
    $('#bplay', c).onclick = showPlay;
  };
  next();
}

function startDuel(cfg) {
  const wrap = document.createElement('div'); wrap.className = 'duel ' + cfg.layout;
  document.body.appendChild(wrap); document.body.classList.add('noscroll');
  const sc = [0, 0]; let round = 0, q, done, locked, timer, left, orders;
  const RT = 20;
  const close = () => { clearInterval(timer); wrap.remove(); document.body.classList.remove('noscroll'); };
  const halfHtml = pl => `<section class="half p${pl + 1}" data-pl="${pl}">
      <div class="pl-head"><span>${esc(cfg.names[pl])}</span><span class="pl-score">${sc[pl]}</span></div>
      <div class="pl-q">${q.q}</div>
      <div class="pl-opts">${orders[pl].map(i => `<button type="button" data-i="${i}">${q.opts[i]}</button>`).join('')}</div>
      <div class="pl-msg"></div></section>`;
  function layout() {
    const mid = `<div class="mid"><span>Runde ${round}/${cfg.rounds}</span><div class="tbar"><div id="dtb" style="width:100%"></div></div><button class="btn small" type="button" id="dx">✕ Beenden</button></div>`;

    });
  }
  const half = pl => $(`.half[data-pl="${pl}"]`, wrap);
  function reveal(msgs) {
    done = true; clearInterval(timer);
    [0, 1].forEach(pl => {
      const h = half(pl); $$('.pl-opts button', h).forEach(b => { if (+b.dataset.i === q.a) b.classList.add('right'); });
      $('.pl-msg', h).textContent = msgs[pl]; $('.pl-score', h).textContent = sc[pl];
    });
    setTimeout(next, 2200);
  }
  function tap(pl, i, btn) {
    if (done || locked[pl]) return;
    if (i === q.a) { sc[pl]++; btn.classList.add('right'); reveal(pl === 0 ? ['🎉 Punkt für dich!', `Zu langsam – Punkt für ${cfg.names[0]}`] : [`Zu langsam – Punkt für ${cfg.names[1]}`, '🎉 Punkt für dich!']); }
    else {
      locked[pl] = true; btn.classList.add('wrong'); half(pl).classList.add('locked');

      if (locked[0] && locked[1]) reveal(['Beide falsch – hier ist die Lösung.', 'Beide falsch – hier ist die Lösung.']);
    }
  }
  function next() {
    if (!document.body.contains(wrap)) return;
    round++;
    if (round > cfg.rounds) return end();
    q = gameQ(cfg.units); done = false; locked = [false, false];

    layout(); left = RT;
    timer = setInterval(() => {
      left -= 0.25; const tb = $('#dtb', wrap); if (tb) tb.style.width = Math.max(0, left / RT * 100) + '%';
      if (left <= 0 && !done) reveal(['⏱ Zeit um!', '⏱ Zeit um!']);
    }, 250);
  }
  function end() {
    store.duels++; addXP(20); checkBadges(); save();
    const w = sc[0] === sc[1] ? null : sc[0] > sc[1] ? 0 : 1;
    wrap.innerHTML = `<div class="end"><div style="font-size:3.5rem">${w === null ? '🤝' : '🏆'}</div>
      <h2>${w === null ? 'Unentschieden!' : `${esc(cfg.names[w])} gewinnt!`}</h2>
      <div class="score-big"><span style="color:var(--u1)">${sc[0]}</span> : <span style="color:var(--u4)">${sc[1]}</span></div>
      <p class="muted">${esc(cfg.names[0])} gegen ${esc(cfg.names[1])}</p>
      <div class="actions" style="justify-content:center"><button class="btn primary" type="button" id="drev">⚔️ Revanche</button><button class="btn" type="button" id="dend">Zurück</button></div></div>`;
    confetti();

    $('#dend', wrap).onclick = () => { close(); showPlay(); };

function tandemRun(c, names, units) {
  const R = 10; let round = 0, pts = 0;
  const next = () => {
    round++;
    if (round > R) return end();
    const calc = names[(round + 1) % 2], chk = names[round % 2];
    const q = gameQ(units); let sel = null, fixed = false;
    c.innerHTML = `<div class="bighead"><span>Runde ${round}/${R}</span><span>🤝 Team: <span class="big">${pts}</span> Punkte</span></div>
      <div class="roles"><div class="role on">🧮 <b>${esc(calc)}</b> rechnet</div><div class="role">🧐 <b>${esc(chk)}</b> prüft</div></div>
      <div class="q-text">${q.q}</div>
      <div class="opts">${q.opts.map((o, i) => `<button class="opt" type="button" data-i="${i}">${o}</button>`).join('')}</div>
      <div class="actions"><button class="btn primary" type="button" id="tlock" disabled>Antwort festlegen</button></div><div id="tstep"></div>`;
    $$('.opt', c).forEach(b => b.onclick = () => {
      if (fixed) return;
      sel = +b.dataset.i; $$('.opt', c).forEach(x => x.classList.toggle('sel', x === b)); $('#tlock', c).disabled = false;
    });
    $('#tlock', c).onclick = () => {

      $$('.role', c).forEach((r, i) => r.classList.toggle('on', i === 1));
      $('#tstep', c).innerHTML = `<div class="fb try"><div class="fb-title">🧐 ${esc(chk)}: Stimmt die Antwort von ${esc(calc)}?</div>
        <div class="actions"><button class="btn" type="button" data-j="1">👍 Stimmt</button><button class="btn" type="button" data-j="0">👎 Stimmt nicht</button></div></div>`;
      $$('#tstep button', c).forEach(b => b.onclick = () => {
        const ok = sel === q.a, judge = b.dataset.j === '1', judgeOk = judge === ok;
        const gain = (ok ? 2 : 0) + (judgeOk ? 1 : 0); pts += gain;
        $$('.opt', c).forEach(x => { x.disabled = true; if (+x.dataset.i === q.a) x.classList.add('right'); if (+x.dataset.i === sel && !ok) x.classList.add('wrong'); });
        const mis = ok ? null : diagnose(q, sel);
        $('#tstep', c).innerHTML = `<div class="fb ${ok ? 'ok' : 'bad'}"><div class="fb-title">${ok ? '✔ Richtig gerechnet!' : '✘ Die Antwort war falsch.'} ${judgeOk ? '· 🧐 Gut geprüft!' : '· 🧐 Die Prüfung lag daneben.'} (+${gain})</div>
          ${mis ? misBox(mis, false) : ''}<div class="expl"><b>Lösungsweg:</b> ${q.expl}</div>
          <div class="box-tip" style="margin-bottom:0"><b class="h">💬 Erklärt es euch</b>${esc(chk)} erklärt ${esc(calc)} in eigenen Worten, warum die Lösung stimmt. Dann tauscht ihr die Rollen.</div></div>
          <div class="actions"><button class="btn primary" type="button" id="tnext">${round < R ? 'Nächste Runde →' : 'Auswertung'}</button></div>`;
        $('#tnext', c).onclick = next;
      });
    };
  };
  const end = () => {
    store.tandems++; addXP(Math.round(pts * 1.5)); checkBadges(); save();
    const msg = pts >= 26 ? 'Unschlagbares Team! 🏆' : pts >= 18 ? 'Starke Teamarbeit! 💪' : 'Gut gemacht – beim nächsten Mal knackt ihr die 20!';
    c.innerHTML = `<div style="text-align:center"><div style="font-size:3rem">🤝</div><div class="score-big">${pts} / ${R * 3}</div><p>${esc(names[0])} & ${esc(names[1])}: ${msg}</p></div>
      <div class="actions" style="justify-content:center"><button class="btn primary" type="button" id="tagain">Nochmal</button><button class="btn" type="button" id="tplay">Zurück zu Spielen</button></div>`;
    if (pts >= 18) confetti();
    $('#tagain', c).onclick = () => tandemRun(c, names, units);
    $('#tplay', c).onclick = showPlay;
  };
  next();
}

/* ---------- Fehlerdetektiv ---------- */
function startDetective(units) {
  const c = gameShell('Fehlerdetektiv', '🕵️');
  let cases = shuffle(FIND.filter(f => units.includes(f.u))).slice(0, 6);
  if (!cases.length) cases = shuffle(FIND).slice(0, 6);
  let i = 0, found = 0;
  const show = () => {
    if (i >= cases.length) return end();
    const f = cases[i]; let miss = 0, over = false;
    c.innerHTML = `<div class="bighead"><span>🔍 Fall ${i + 1} von ${cases.length}</span><span>Sofort gefunden: ${found}</span></div>
      <p style="margin-top:12px"><b>${f.who}</b> rechnet: <b>${f.task}</b>. In einer Zeile steckt ein Fehler. <b>Tippe auf die falsche Zeile.</b></p>
      ${f.lines.map((l, k) => `<button class="dline" type="button" data-k="${k}"><span class="ln">${k + 1}</span>${l}</button>`).join('')}
      <div id="dfb"></div>`;
    $$('.dline', c).forEach(b => b.onclick = () => {
      if (over) return;
      const k = +b.dataset.k;
      if (k === f.w) {
        over = true; if (!miss) { found++; store.detect++; addXP(10); }
        b.classList.add('found');
        $$('.dline', c).forEach(x => x.disabled = true);
        $('#dfb', c).innerHTML = `<div class="fb ok"><div class="fb-title">${miss ? '✔ Gefunden!' : '🕵️ Sofort gefunden!'}</div><div>${f.why}</div><div style="margin-top:6px">Richtig wäre: <b>${f.fix}</b></div></div>
          <div class="actions"><button class="btn primary" type="button" id="dnext">${i + 1 < cases.length ? 'Nächster Fall →' : 'Auswertung'}</button></div>`;
        $('#dnext', c).onclick = () => { i++; show(); };
        checkBadges(); save();
      } else {
        miss++; b.classList.add('right'); b.disabled = true;
        $('#dfb', c).innerHTML = `<div class="fb try"><div class="fb-title">Diese Zeile stimmt. Such weiter!</div></div>`;
        if (miss >= 2) {
          over = true; $$('.dline', c).forEach(x => { x.disabled = true; if (+x.dataset.k === f.w) x.classList.add('found'); });
          $('#dfb', c).innerHTML = `<div class="fb bad"><div class="fb-title">Der Fehler steckt in Zeile ${f.w + 1}.</div><div>${f.why}</div><div style="margin-top:6px">Richtig wäre: <b>${f.fix}</b></div></div>
            <div class="actions"><button class="btn primary" type="button" id="dnext">${i + 1 < cases.length ? 'Nächster Fall →' : 'Auswertung'}</button></div>`;
          $('#dnext', c).onclick = () => { i++; show(); };
        }
      }
    });
  };
  const end = () => {
    c.innerHTML = `<div style="text-align:center"><div style="font-size:3rem">🕵️</div><div class="score-big">${found} / ${cases.length}</div><p>Fehler sofort gefunden. ${found === cases.length ? 'Meisterleistung!' : 'Wer Fehler bei anderen findet, macht sie selbst seltener.'}</p></div>
      <div class="actions" style="justify-content:center"><button class="btn primary" type="button" id="dagain">Neue Fälle</button><button class="btn" type="button" id="dplay">Zurück zu Spielen</button></div>`;
    $('#dagain', c).onclick = () => startDetective(units);
    $('#dplay', c).onclick = showPlay;
  };
  show();
}

  if (fixed.length) { need(24); y += 4; T(M, y + 8, 'Gezielt geübt und überwunden:', 8.5, 'F2', '#2b8a3e'); y += 11; p.wrap(fixed.map(id => MIS[id].t).join(', '), 8, 'F1', CW).forEach(l => { need(11); T(M + 10, y + 8, l, 8, 'F1', '#334155'); y += 10; }); }
  // Aufgaben des Probe-Lernnachweises
  if (F && F.items && F.items.length) {
    head('Probe-Lernnachweis: alle Aufgaben');
    const secN = { A1: 'A1', A2: 'A2', W: 'W' }; let cnt = {};
    F.items.forEach(it => {
      cnt[it.sec] = (cnt[it.sec] || 0) + 1;
      const tl = p.wrap(pdfTxt(it.t), 8, 'F1', CW - 90).slice(0, 3);
      const al = p.wrap(`Antwort: ${pdfTxt(it.given || '–')}   ·   richtig: ${pdfTxt(it.sol)}`, 7.5, 'F1', CW - 90).slice(0, 2);
      const h = 6 + tl.length * 10 + al.length * 9;
      need(h + 4);
      p.rrect(M, y, CW, h, 4, it.ok ? '#f0fdf4' : '#fef2f2');
      T(M + 6, y + 11, `${secN[it.sec]}.${cnt[it.sec]}`, 8, 'F2', '#334155');
      T(M + CW - 6, y + 11, `${it.got}/${it.max} P.`, 8.5, 'F2', it.ok ? '#2b8a3e' : '#b91c1c', 'right');
      let yy = y + 11; tl.forEach(l => { T(M + 40, yy, l, 8, 'F1'); yy += 10; }); al.forEach(l => { T(M + 40, yy, l, 7.5, 'F1', it.ok ? '#166534' : '#991b1b'); yy += 9; });
      y += h + 4;
    });
  }
  // Unterschrift
  need(50); y += 16; p.line(M, y + 22, M + 200, y + 22, '#94a3b8', 0.6); T(M, y + 32, 'Bemerkung der Lehrkraft', 7.5, 'F1', '#64748b');
  p.line(W - M - 160, y + 22, W - M, y + 22, '#94a3b8', 0.6); T(W - M - 160, y + 32, 'Datum, Unterschrift', 7.5, 'F1', '#64748b');
  footer();
  return p.out(`Lernstand Sachrechnen ${store.name || ''}`);
}
function pdfFile() {
  const bytes = buildLernPDF(), d = new Date().toLocaleDateString('de-DE').replace(/\./g, '-');
  const fn = (`Lernstand_Sachrechnen_${(store.name || 'ohne_Namen').replace(/\s+/g, '_')}_${d}.pdf`).replace(/[^\wäöüÄÖÜß.\-]/g, '');
  return { bytes, fn };
}
async function pdfOut(mode) {
  let f;
  try { f = pdfFile(); } catch (e) { toast('⚠️ Das PDF konnte nicht erstellt werden.'); return; }
  store.pdfs = (store.pdfs || 0) + 1; checkBadges(); save();
  const blob = new Blob([f.bytes], { type: 'application/pdf' });
  if (mode === 'share') {
    try { const file = new File([blob], f.fn, { type: 'application/pdf' }); if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'Lernstand Sachrechnen' }); return; } }
    catch (e) { if (e && e.name === 'AbortError') return; }
    toast('ℹ️ Teilen ist hier nicht möglich – die Datei wird stattdessen heruntergeladen.'); mode = 'download';
  }
  const url = URL.createObjectURL(blob);
  if (mode === 'open') { const w = window.open(url, '_blank'); if (!w) location.href = url; setTimeout(() => URL.revokeObjectURL(url), 60000); return; }
  const a = document.createElement('a'); a.href = url; a.download = f.fn; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 5000); toast('📄 PDF erstellt: ' + esc(f.fn));
}

function confetti() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const box = document.createElement('div'); box.className = 'confetti';
  const cols = ['--u1', '--u2', '--u3', '--u4', '--u5', '--warn', '--ok'].map(v => getComputedStyle(document.documentElement).getPropertyValue(v));
  for (let i = 0; i < 90; i++) {
    const p = document.createElement('i');
    p.style.left = Math.random() * 100 + 'vw'; p.style.background = pick(cols);
    p.style.animationDuration = (1.8 + Math.random() * 1.8) + 's'; p.style.animationDelay = Math.random() * 0.6 + 's';
    box.appendChild(p);
  }
  document.body.appendChild(box); setTimeout(() => box.remove(), 4500);
}
